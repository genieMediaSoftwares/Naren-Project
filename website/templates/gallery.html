{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="py-10 sm:py-14 bg-[#d7eceb]">

    <div class="site-container">

        <!-- HEADING -->

        <div class="text-center mb-10">

            <p class="uppercase tracking-[4px] text-[#0F9B8E] font-semibold text-sm mb-4">
                Our Gallery
            </p>

            <h1 class="fluid-h2 text-[#08113a] font-extrabold">

                Moments & Medical Excellence

            </h1>

        </div>

        <!-- GALLERY GRID -->

        <div class="auto-grid" style="--min: 280px; --gap: 24px;">

            <!-- ANTENATAL -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service1.png' %}"
                    alt="Antenatal Scans"
                    class="media-fit">

                <div class="p-5 text-center">

                    <h3 class="fluid-h3 text-[#08113a] font-bold">
                        Antenatal & Gynecological Scans
                    </h3>

                </div>

            </div>

            <!-- ROUTINE -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service2.png' %}"
                    alt="Routine Scans"
                    class="media-fit">

                <div class="p-5 text-center">

                    <h3 class="fluid-h3 text-[#08113a] font-bold">
                        Routine Scans
                    </h3>

                </div>

            </div>

            <!-- PAEDIATRIC -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service3.png' %}"
                    alt="Paediatric Scans"
                    class="media-fit">

                <div class="p-5 text-center">

                    <h3 class="fluid-h3 text-[#08113a] font-bold">
                        Paediatric Scans
                    </h3>

                </div>

            </div>

            <!-- DOPPLER -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service4.png' %}"
                    alt="Doppler Scans"
                    class="media-fit">

                <div class="p-5 text-center">

                    <h3 class="fluid-h3 text-[#08113a] font-bold">
                        Doppler Scans
                    </h3>

                </div>

            </div>

            <!-- USG GUIDED -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service5.png' %}"
                    alt="USG Guided Procedures"
                    class="media-fit">

                <div class="p-5 text-center">

                    <h3 class="fluid-h3 text-[#08113a] font-bold">
                        USG Guided Procedures
                    </h3>

                </div>

            </div>

            <!-- SMALL PARTS -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service6.png' %}"
                    alt="USG Small Parts"
                    class="media-fit">

                <div class="p-5 text-center">

                    <h3 class="fluid-h3 text-[#08113a] font-bold">
                        USG Small Parts
                    </h3>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
