{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="py-10 sm:py-14 bg-[#f8f5ff]">

    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">

        <!-- HEADING -->

        <div class="text-center mb-10">

            <p class="uppercase tracking-[4px] text-[#5b21b6] font-semibold text-sm mb-4">
                Our Gallery
            </p>

            <h1 class="text-[#08113a]
            text-4xl
            sm:text-5xl
            lg:text-6xl
            font-extrabold">

                Moments & Medical Excellence

            </h1>

        </div>

        <!-- GALLERY GRID -->

        <div class="grid
        grid-cols-1
        sm:grid-cols-2
        lg:grid-cols-3
        gap-6">

            <!-- ANTENATAL -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service1.png' %}"
                    alt="Antenatal Scans"
                    class="w-full h-[250px] object-cover">

                <div class="p-5 text-center">

                    <h3 class="text-[#08113a] text-2xl font-bold">
                        Antenatal & Gynecological Scans
                    </h3>

                </div>

            </div>

            <!-- ROUTINE -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service2.png' %}"
                    alt="Routine Scans"
                    class="w-full h-[250px] object-cover">

                <div class="p-5 text-center">

                    <h3 class="text-[#08113a] text-2xl font-bold">
                        Routine Scans
                    </h3>

                </div>

            </div>

            <!-- PAEDIATRIC -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service3.png' %}"
                    alt="Paediatric Scans"
                    class="w-full h-[250px] object-cover">

                <div class="p-5 text-center">

                    <h3 class="text-[#08113a] text-2xl font-bold">
                        Paediatric Scans
                    </h3>

                </div>

            </div>

            <!-- DOPPLER -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service4.png' %}"
                    alt="Doppler Scans"
                    class="w-full h-[250px] object-cover">

                <div class="p-5 text-center">

                    <h3 class="text-[#08113a] text-2xl font-bold">
                        Doppler Scans
                    </h3>

                </div>

            </div>

            <!-- USG GUIDED -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service5.png' %}"
                    alt="USG Guided Procedures"
                    class="w-full h-[250px] object-cover">

                <div class="p-5 text-center">

                    <h3 class="text-[#08113a] text-2xl font-bold">
                        USG Guided Procedures
                    </h3>

                </div>

            </div>

            <!-- SMALL PARTS -->

            <div class="bg-white rounded-[24px]
            overflow-hidden
            shadow-md
            hover:shadow-2xl
            transition duration-300">

                <img src="{% static 'images/service6.png' %}"
                    alt="USG Small Parts"
                    class="w-full h-[250px] object-cover">

                <div class="p-5 text-center">

                    <h3 class="text-[#08113a] text-2xl font-bold">
                        USG Small Parts
                    </h3>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
