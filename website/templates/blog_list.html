{% extends 'base.html' %}

{% load static %}

{% block content %}

<section class="py-16 bg-[#dfeeee]">

    <div class="container mx-auto px-6">

        <h1 class="text-4xl font-bold text-center mb-12 text-[#008f8c]">

            Health Articles & Pregnancy Care

        </h1>

        <div class="grid lg:grid-cols-3 md:grid-cols-2 gap-10">

            {% for post in posts %}

            <div class="bg-white rounded-3xl overflow-hidden shadow-xl hover:-translate-y-2 transition duration-300">

                {% if post.featured_image %}

                <img
                    src="{{ post.featured_image.url }}"
                    alt="{{ post.title }}"
                    class="w-full h-56 object-cover"
                >

                {% endif %}

                <div class="p-6">

                    <h2 class="text-2xl font-bold mb-3">

                        {{ post.title }}

                    </h2>

                    <p class="text-gray-600 mb-4">

                        {{ post.short_description }}

                    </p>

                    <a
                        href="{% url 'blog_detail' post.slug %}"
                        class="inline-block px-5 py-2 rounded-full bg-[#00b5ad] text-white"
                    >
                        Read More
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</section>

{% endblock %}
